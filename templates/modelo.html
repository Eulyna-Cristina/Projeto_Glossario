<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fundamentos Python</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container">

      <a class="navbar-brand fw-bold" href="/">
        🐍 Fundamentos Python
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link" href="/">Início</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/equipe">Sobre a equipe</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button"
               data-bs-toggle="dropdown">
              Glossário
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/glossario">Visualizar</a></li>
              <li><a class="dropdown-item" href="/novo_termo">Novo termo</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="/conteudo">Conteúdo do Site</a></li>
            </ul>
          </li>

          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2" href="/duvidas">
              Dúvidas
              <img src="{{ url_for('static', filename='img/gemini_logo.png') }}"
                   alt="Gemini"
                   width="18"
                   height="18">
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>


  <main class="flex-fill">
    {% block conteudo %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-body-tertiary text-center py-3 mt-4 border-top">
    <small class="text-secondary">
      © 2026 • Projeto Flask – Fundamentos de Python
    </small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
